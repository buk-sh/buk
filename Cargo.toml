[package]
name = "runt"
version = "0.1.0"
edition = "2024"

[dependencies]
v8 = "0.74"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = "0.11"
dotenvy = "0.15"
notify = "6.1"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mime = "0.3"
regex = "1"
